allowBuilds:
  esbuild: true

engineStrict: true

saveExact: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - vite
  - "semver@6.3.1"
  - "tsrs@7.1.0-beta.tsrs2"
packages:
  - apps/*
  - packages/*
catalog:
  "@playwright/test": 1.65.1
  "@tailwindcss/vite": 4.3.5
  "@vitejs/plugin-basic-ssl": 2.3.0
  eslint-plugin-tailwindcss: 4.4.0
  tailwindcss: 4.3.5
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.1
  vite-plus: 1.7.0
  "@vitest/coverage-v8": 5.1.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@112ka/x"
