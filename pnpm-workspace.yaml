allowBuilds:
  esbuild: true
  sharp: set this to true or false
  simple-git-hooks: true

engineStrict: true

saveExact: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - vite
  - "semver@6.3.1"
packages:
  - apps/*
  - packages/*
catalog:
  "@playwright/test": 1.64.1
  "@tailwindcss/vite": 4.3.3
  "@vitejs/plugin-basic-ssl": 2.3.0
  eslint-plugin-tailwindcss: 4.3.0
  tailwindcss: 4.3.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@112ka/x@0.0.11 || 0.0.12"
