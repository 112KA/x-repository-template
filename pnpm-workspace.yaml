allowBuilds:
  esbuild: true
  sharp: set this to true or false
  simple-git-hooks: true

engineStrict: true

saveExact: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - vite
packages:
  - apps/*
  - packages/*
catalog:
  "@playwright/test": 1.62.1
  "@tailwindcss/vite": 4.3.3
  "@vitejs/plugin-basic-ssl": 2.3.0
  eslint-plugin-tailwindcss: 4.3.0
  tailwindcss: 4.3.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
  "@vitest/coverage-v8": 4.1.11
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
