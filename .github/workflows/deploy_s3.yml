name: Deploy S3
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: choice target environment
        required: true
        default: develop
        options:
          - develop
          - staging
          - production
#   push:
#     branches:
#       - 'develop'

permissions:
  contents: read

env:
  BUCKET: my-bucket-name
  DEPLOY_LOCAL_DIR: ./apps/app-vite/build/client

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - id: config
        run: |
          case "${{ inputs.target }}" in
            develop)
              echo "bucket=${{ env.BUCKET }}-dev" >> $GITHUB_OUTPUT
              echo "deploy-branch=develop" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "bucket=${{ env.BUCKET }}-stg" >> $GITHUB_OUTPUT
              echo "deploy-branch=develop" >> $GITHUB_OUTPUT
              ;;
            production)
              echo "bucket=${{ env.BUCKET }}-prd" >> $GITHUB_OUTPUT
              echo "deploy-branch=main" >> $GITHUB_OUTPUT
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.config.outputs.deploy-branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: git lfs pull

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          node-version-file: package.json

      # - name: Remove develop directory for staging/production
      #   if: inputs.target == 'staging' || inputs.target == 'production'
      #   run: rm -rf './apps/app-vite/src/app/(examples)'

      - run: pnpm app build

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ap-northeast-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - run: |
          aws s3 sync ${{ env.DEPLOY_LOCAL_DIR }} s3://${{ steps.config.outputs.bucket }} --delete
